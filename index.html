<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>현황 대시보드 - 공용 물품 관리</title>
<script>
  (function () {
    var pref = localStorage.getItem('supply-app-theme') || 'system';
    var resolved = pref === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : pref;
    document.documentElement.setAttribute('data-theme', resolved);
  })();
</script>
<link rel="stylesheet" href="assets/css/styles.css?v=1" />
</head>
<body>
  <div class="app-shell">
    <button id="hamburger-btn" class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <h1 class="page-title">현황 대시보드</h1>
      <div id="dashboard-error" class="error-banner" hidden></div>

      <div class="dashboard-grid">
        <section class="card card-total">
          <h2>총 품목 수</h2>
          <div class="big-number" id="total-item-count">-</div>
        </section>

        <section class="card card-recent">
          <h2>최근 변경 내역</h2>
          <ul class="recent-list" id="recent-changes-list">
            <li class="empty">불러오는 중...</li>
          </ul>
        </section>

        <section class="card card-category">
          <h2>카테고리 분포</h2>
          <div class="chart-wrap">
            <canvas id="category-chart"></canvas>
          </div>
        </section>

        <section class="card card-shortage">
          <h2>재고 부족</h2>
          <ul class="shortage-list" id="shortage-list">
            <li class="empty">불러오는 중...</li>
          </ul>
          <div class="shortage-summary" id="shortage-summary"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="assets/js/config.js?v=1"></script>
  <script src="assets/js/theme.js?v=1"></script>
  <script src="assets/js/nickname.js?v=1"></script>
  <script src="assets/js/nav.js?v=1"></script>
  <script src="assets/js/dashboard.js?v=1"></script>
</body>
</html>
